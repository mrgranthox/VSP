name: vsp

x-backend-service: &backend-service
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - ./backend/.env.example
    - ./backend/.env.compose.example
  init: true
  volumes:
    - backend-storage:/app/.tmp/storage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vsp_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vsp_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  typesense:
    image: typesense/typesense:27.1
    profiles: ["search"]
    command:
      - "--data-dir"
      - "/data"
      - "--api-key"
      - "dev-typesense-api-key"
      - "--enable-cors"
    ports:
      - "${TYPESENSE_PUBLISHED_PORT:-8108}:8108"
    volumes:
      - typesense-data:/data

  api:
    <<: *backend-service
    command: sh -c "npm run db:migrate:deploy && npm start"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      BACKGROUND_WORKERS_ENABLED: "false"
      CDN_BASE_URL: ${CDN_BASE_URL:-http://localhost:3000}
      EVENT_BUS_MODE: ${EVENT_BUS_MODE:-inline}
      TYPESENSE_HOST: ${TYPESENSE_HOST:-}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev-typesense-api-key}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "${API_PORT:-3000}:3000"

  workers:
    <<: *backend-service
    profiles: ["workers"]
    command: sh -c "npm run db:migrate:deploy && npm run workers"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      EVENT_BUS_MODE: "queue"
      TYPESENSE_HOST: ${TYPESENSE_HOST:-}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev-typesense-api-key}

  gateway:
    <<: *backend-service
    profiles: ["realtime"]
    command: npm run gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "${WS_GATEWAY_PUBLISHED_PORT:-3002}:3002"

  seed:
    <<: *backend-service
    profiles: ["setup"]
    command: sh -c "npm run db:migrate:deploy && npm run db:seed"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  backend-storage:
  postgres-data:
  redis-data:
  typesense-data:
