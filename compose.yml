name: vsp

x-backend-service: &backend-service
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - ${BACKEND_ENV_FILE:-./backend/.env.example}
    - ${BACKEND_COMPOSE_ENV_FILE:-./backend/.env.compose.example}
  init: true
  volumes:
    - backend-storage:/app/.tmp/storage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vsp_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vsp_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  typesense:
    image: typesense/typesense:27.1
    profiles: ["search"]
    command:
      - "--data-dir"
      - "/data"
      - "--api-key"
      - "dev-typesense-api-key"
      - "--enable-cors"
    ports:
      - "${TYPESENSE_PUBLISHED_PORT:-8108}:8108"
    volumes:
      - typesense-data:/data

  api:
    <<: *backend-service
    command: sh -c "npm run db:migrate:deploy && npm start"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      BACKGROUND_WORKERS_ENABLED: "false"
      CDN_BASE_URL: ${CDN_BASE_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4173,http://localhost:3002}
      EVENT_BUS_MODE: ${EVENT_BUS_MODE:-inline}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_FLUSH_TIMEOUT_MS: ${SENTRY_FLUSH_TIMEOUT_MS:-2000}
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_CONSOLE_EXPORTER_ENABLED: ${OTEL_CONSOLE_EXPORTER_ENABLED:-false}
      OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-1}
      TYPESENSE_HOST: ${TYPESENSE_HOST:-}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev-typesense-api-key}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "${API_PORT:-3000}:3000"

  workers:
    <<: *backend-service
    profiles: ["workers"]
    command: sh -c "npm run db:migrate:deploy && npm run workers"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      EVENT_BUS_MODE: "queue"
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_FLUSH_TIMEOUT_MS: ${SENTRY_FLUSH_TIMEOUT_MS:-2000}
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_CONSOLE_EXPORTER_ENABLED: ${OTEL_CONSOLE_EXPORTER_ENABLED:-false}
      OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-1}
      TYPESENSE_HOST: ${TYPESENSE_HOST:-}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev-typesense-api-key}

  gateway:
    <<: *backend-service
    profiles: ["realtime"]
    command: npm run gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_FLUSH_TIMEOUT_MS: ${SENTRY_FLUSH_TIMEOUT_MS:-2000}
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_CONSOLE_EXPORTER_ENABLED: ${OTEL_CONSOLE_EXPORTER_ENABLED:-false}
      OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-1}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "${WS_GATEWAY_PUBLISHED_PORT:-3002}:3002"

  jaeger:
    image: jaegertracing/all-in-one:1.61.0
    profiles: ["tracing"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"

  alert-echo:
    image: mendhak/http-https-echo:34
    profiles: ["monitoring"]
    ports:
      - "${ALERT_ECHO_PORT:-18080}:8080"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["monitoring"]
    environment:
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-http://alert-echo:8080/alerts}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        sed "s|__ALERTMANAGER_WEBHOOK_URL__|$${ALERTMANAGER_WEBHOOK_URL}|g" /etc/alertmanager/alertmanager.yml.template > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    volumes:
      - ./backend/observability/alertmanager/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - ./backend/observability/alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    depends_on:
      alert-echo:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-compose-internal-key}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        sed "s|__INTERNAL_API_KEY__|$${INTERNAL_API_KEY}|g" /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --web.enable-lifecycle
    volumes:
      - ./backend/observability/prometheus/prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
      - ./backend/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_started
      alertmanager:
        condition: service_started

  grafana:
    image: grafana/grafana-oss:11.1.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./backend/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./backend/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_started

  seed:
    <<: *backend-service
    profiles: ["setup"]
    command: sh -c "npm run db:migrate:deploy && npm run db:seed"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-web:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${ADMIN_VITE_API_BASE_URL:-http://localhost:3000/api/v1}
        VITE_APP_NAME: ${ADMIN_VITE_APP_NAME:-VSP Admin}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "${ADMIN_PORT:-4173}:80"

volumes:
  backend-storage:
  postgres-data:
  redis-data:
  typesense-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
